    const amigos = [{nome: "Ana", idade: 20},
            {nome: "Bruno", idade: 17},
            {nome: "Cátia", idade: 25}];

    const amigos2 = amigos.filter(aux => aux.idade >= 21 || aux.nome.includes("B"));

    const todos = amigos.reduce((acumulador, amigo) => acumulador + amigo.nome + ", ", "");

    console.log(`Todos: ${todos} `);
