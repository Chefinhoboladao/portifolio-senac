<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Saudação</title>
  <link rel="stylesheet" href="../../assets/estilo.css">
</head>
<body>
  <main>
    <a class="voltar" href="../../index.html">&larr; Voltar ao menu</a>
    <h1>Saudação</h1>
    <p>Concatenação e template string.</p>
    <p class="dica">Recarregue a página para executar de novo.</p>
  </main>
  <script>
 

     const nome = prompt("Qual o seu nome?");

    
    // frase com formatação normal utilizando concatenação

    alert("Olá " + nome + "\n , tudo bem?");

    // frase utilizando TEMPLATE STRING para formatar o texto

    alert(`Olá ${nome}, tudo bem?`);
  </script>
</body>
</html>
