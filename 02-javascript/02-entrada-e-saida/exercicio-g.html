<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>G - Formas de pagamento</title>
  <link rel="stylesheet" href="../../assets/estilo.css">
</head>
<body>
  <main>
    <a class="voltar" href="../../index.html">&larr; Voltar ao menu</a>
    <h1>G - Formas de pagamento</h1>
    <p>À vista com 10% de desconto ou em 3x.</p>
    <p class="dica">Recarregue a página para executar de novo.</p>
  </main>
  <script>
const valortotal = Number(prompt("valor total"));
const desconto = valortotal /10 

alert("Preço: R$ " + valortotal.toFixed(2))
alert("À vista: R$ " + (valortotal - desconto).toFixed(2) + " ou 3x de R$ " + (valortotal / 3).toFixed(2))
  </script>
</body>
