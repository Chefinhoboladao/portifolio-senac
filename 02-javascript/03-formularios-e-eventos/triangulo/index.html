<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Triângulo</title>
  <link rel="stylesheet" href="../../../assets/estilo.css">
</head>
<body>
  <main>
    <a class="voltar" href="../../../index.html">&larr; Voltar ao menu</a>
    <h1>Triângulo</h1>
    <p>Verifica os lados e o tipo de triângulo.</p>
    <form>
      <p>Lado A: <input type="number" id="inLadoA" min="0.01" step="any" required></p>
      <p>Lado B: <input type="number" id="inLadoB" min="0.01" step="any" required></p>
      <p>Lado C: <input type="number" id="inLadoC" min="0.01" step="any" required></p>
      <p><input type="submit" value="Verificar lados"></p>
    </form>
    <h3 id="outSimNao"></h3>
    <h3 id="outTipo"></h3>
  </main>
  <script src="script.js"></script>
</body>
</html>
