<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Revenda de veículos</title>
  <link rel="stylesheet" href="../../../assets/estilo.css">
</head>
<body>
  <main>
    <a class="voltar" href="../../../index.html">&larr; Voltar ao menu</a>
    <h1>Revenda de veículos</h1>
    <p>Entrada de 50% e saldo em 12 vezes.</p>
    <form>
      <p>Veículo: <input type="text" id="inVeiculo" required></p>
      <p>Preço: R$ <input type="number" id="inPreco" step="0.01" min="0" required></p>
      <p><input type="submit" value="Ver promoção"></p>
    </form>
    <h3 id="outResp1"></h3>
    <h3 id="outResp2"></h3>
    <h3 id="outResp3"></h3>
  </main>
  <script src="script.js"></script>
</body>
</html>
