<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Restaurante por quilo</title>
  <link rel="stylesheet" href="../../../assets/estilo.css">
</head>
<body>
  <main>
    <a class="voltar" href="../../../index.html">&larr; Voltar ao menu</a>
    <h1>Restaurante por quilo</h1>
    <p>Calcula o valor pelo peso consumido.</p>
    <form>
      <p>Preço por kg: R$ <input type="number" id="inQuilo" step="0.01" min="0" required></p>
      <p>Consumo (gramas): <input type="number" id="inConsumo" min="0" required></p>
      <p><input type="submit" value="Calcular preço"></p>
    </form>
    <h3></h3>
  </main>
  <script src="script.js"></script>
</body>
</html>
