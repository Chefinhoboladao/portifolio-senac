<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Laço while</title>
  <link rel="stylesheet" href="../../assets/estilo.css">
</head>
<body>
  <main>
    <a class="voltar" href="../../index.html">&larr; Voltar ao menu</a>
    <h1>Laço while</h1>
    <p>Contagem regressiva de 10 a 1.</p>
    <p class="dica">Abra o console do navegador (F12) para ver o resultado. Recarregue a página para executar de novo.</p>
  </main>
  <script>
    let i = 10; 
    let resposta = "";

    while (i > 0) {
        resposta = resposta + i + ", \n";
        i--;
    }

    console.log(resposta);
  </script>
</body>
</html>
