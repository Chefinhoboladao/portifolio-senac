<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="estilo.css">
    <title>Perfil social 2.0</title>
</head>
<body>
    

    <div class="profile-card">

        <div class="card-header"></div>

        <div class="card-body">
            <img src="img/avatar.svg" alt="Avatar de Gertrudes" class="profile-img">

            <h2 class="profile-name"><span class="badge">Gertrudes Melo</span></h2>
            <p class="profile-role">Desenvolvedor Front-End</p>
            <p class="profile-location">São Paulo, Brasil</p>

            <p class="profile-bio">Estudante de TI</p>

            <div class="skills-container">
                <span class="skill-tag">HTML</span>
                <span class="skill-tag">CSS</span>
                <span class="skill-tag">JavaScript</span>
                <span class="skill-tag">Git</span>
            </div>

            <div class="stats-container">
                <div class="start-box">
                    <span class="start-number">24</span>
                    <span class="start-label">Projetos</span>
                </div>
                <div class="start-box">
                    <span class="start-number">1.2k</span>
                    <span class="start-label">Seguidores</span>
                </div>
                <div class="start-box">
                    <span class="start-number">350</span>
                    <span class="start-label">Seguindo</span>
                </div>
            </div>

            <div class="actions-container">
                <button class="btn btn-follow">Seguir</button>
                <button class="btn btn-message">Mensagem</button>
            </div>
        </div>
    </div>

</body>
</html>
