<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil social</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: white;
            padding: 20px;
        }

        .card {
            background-color: white;
            width: 400px;
            height: 600px;
            margin: 20px auto;
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 8px;
            box-shadow: 0px 4px 6px rgba(0,0,0,0.1);
            text-align: center;
        }

        .card h2 {
            color: #333;
            font-size: 1.5rem;
            margin-bottom: 10px;
            text-align: center;
        }

        .card p {
            color: #0804fa;
            font-size: 1rem;
            line-height: 1.6;
            text-align: center;
        } 

        .btn {
            display: block; /* Transforma o link/a em bloco para ocupar largura */
            background-color: #007bff;
            color: #fff;
            text-align: center;
            padding: 10px;
            margin-top: 40px;
            border-radius: 4px;
            text-decoration: none;
            font-weight: bold;
            transition: background 0.3s;   /* Efeito suave passar o mouse no botão */
        }

        .btn:hover {
            background-color: #0056b3;
        }

        .imagem {
            border-radius: 50%;
            width: 100px;
            border: 3px solid #ffffff;
            margin-top: 40px;
        }
        
        p.cidade {
            font-size: 12px;
        }

        button{
            color: #2600ff;
            background-color: #bfedff;
            padding: 7px;
            margin-top: 20px;
            font-family:'Trebuchet MS', 'Lucida Sans Unicode', 'Lucida Grande', 'Lucida Sans', Arial, sans-serif;
            border: none;
            border-radius: 50%;

        }
        .box {
            width: 358px;
            height: 80px;
            background-color: rgb(170, 170, 170);
            margin-top: 30px; 
            border-radius: 10px;

            word-spacing: 70px;
            padding: 1cqw 15px;
             
        }

        .box p {
            word-spacing: 30px;
            white-space: nowrap;

        } 

        .box2 {
            width: 358px;
            height: 200px;
            background-color: rgb(32, 110, 255);
            
             
            
        }


    </style>
</head>
<body>


    

    <div class="card">
       
        <div class="box2">

            
            <img class="imagem" alt="Avatar" src="img/avatar.svg">
            
        </div>

        <h2>Martchelo</h2>

        <p> Desenvolvedor full-stack  </p>

        <p class="cidade "style="color:#333">São Paulo, Brasil</p>

        <p style="color:#333"> 
            Estudante de Desenvolvimento de Sistemas
        </p>

        <button>Javascript</button>
        <button>CSS</button>
        <button>C#</button>
        <button>TypeScript</button>

        <div class="box">
            
            <h2>66 1.5k 350</h2>
            <p>Projetos Seguidores Seguindo</p>
            
        </div>

        

        <a href="#" class="btn"> Seguir </a>

        

    </div>

    
    
    
</body>
</html>
