<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cartão de boas-vindas</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: white;
            padding: 20px;
        }

        .cartao {
            background-color: white;
            width: 300px;
            margin: 20px auto;
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 8px;
            box-shadow: 0px 4px 6px rgba(0,0,0,0.1);
        }

        .cartao h2 {
            color: #333;
            font-size: 1.5rem;
            margin-bottom: 10px;
            text-align: center;
        }

        .cartao p {
            color: #333;
            font-size: 1rem;
            line-height: 1.6;
            text-align: justify;
        } 

        .btn {
            display: block; /* Transforma o link/a em bloco para ocupar largura */
            background-color: #007bff;
            color: #fff;
            text-align: center;
            padding: 10px;
            margin-top: 15px;
            border-radius: 4px;
            text-decoration: none;
            font-weight: bold;
            transition: background 0.3s;   /* Efeito suave passar o mouse no botão */
        }

        .btn:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    <div class="cartao">
        <h2>Bem Vindo ao CSS</h2>

        <p>
            Agora entendemos que tudo é uma caixa
            O padding cria espaço interno, borda define o limite
            e a margem separa este card de outros elementos
        </p>

        <a href="#" class="btn"> Saiba Mais </a>
    </div>
    
</body>
</html>
